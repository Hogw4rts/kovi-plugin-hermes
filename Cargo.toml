[package]
name = "kovi-plugin-hermes"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "LLM chat bridge plugin for Kovi — connects QQ to OpenAI-compatible APIs with session continuity"

[dependencies]
kovi = { version = "0.12.7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "fs", "time", "sync", "rt", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1"
thiserror = "2"
futures-util = "0.3"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
